# Público não é a mesma coisa que indexado.
#
# Um Echo aprovado toca para qualquer pessoa com o link — é assim que ele
# circula no WhatsApp e traz gente nova. Mas um desabafo pessoal não pode ficar
# arquivado num buscador por anos, o que contradiz a promessa de conteúdo
# efêmero. O cabeçalho HTTP é o que vale, porque não depende de o rastreador
# executar o JavaScript da SPA.
#
# O `map` é necessário: numa SPA, /e/:id cai em /index.html por try_files, e
# esse redirecionamento interno entra em `location /` — um add_header colocado
# numa location específica de /e/ seria descartado no caminho. Com a variável,
# o cabeçalho é decidido pela URL pedida, não pelo arquivo servido. Valor vazio
# faz o nginx não emitir o cabeçalho.
map $request_uri $shhhh_robots {
    default          "";
    "~^/e/"          "noindex, noarchive, nosnippet";
    # /v/ também no servidor durante o beta. A escolha do dono existe no banco
    # (voices.indexable), mas quem a aplica hoje é a meta tag trocada pelo
    # JavaScript — e nem todo rastreador executa a SPA antes de decidir indexar.
    # Privacidade primeiro: enquanto não houver renderização no servidor para
    # honrar o opt-in por handle, nenhuma Voice é indexada.
    "~^/v/"          "noindex, noarchive";
    "~^/app/"        "noindex, nofollow";
    "~^/admin"       "noindex, nofollow";
    "~^/auth"        "noindex, nofollow";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash no nome podem ser cacheados por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota (/e/:id, /v/:handle, /app/echoes, /ouvir) cai no
    # index.html. A diretiva de robôs vem do `map` acima, pela URL pedida.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $shhhh_robots always;
        try_files $uri $uri/ /index.html;
    }
}
