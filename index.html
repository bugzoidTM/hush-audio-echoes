
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>Shhhh - Rede Social de Áudio Temporário</title>
    <meta name="description" content="Compartilhe áudios autênticos que desaparecem em 24 horas. Conecte-se através da voz, participe de desafios diários e descubra uma nova forma de se expressar no tempo certo." />
    <meta name="keywords" content="áudio temporário, rede social, voz, áudio efêmero, compartilhar áudio, desafios diários, expressão vocal" />
    <meta name="author" content="Shhhh" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shhhh.me/" />
    <meta property="og:title" content="Shhhh - Rede Social de Áudio Temporário" />
    <meta property="og:description" content="Compartilhe áudios autênticos que desaparecem em 24 horas. Conecte-se através da voz e descubra uma nova forma de se expressar." />
    <meta property="og:image" content="/lovable-uploads/a384c699-fcd9-4ac6-bcf9-612e01bab15d.png" />
    <meta property="og:site_name" content="Shhhh" />
    <meta property="og:locale" content="pt_BR" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://shhhh.me/" />
    <meta property="twitter:title" content="Shhhh - Rede Social de Áudio Temporário" />
    <meta property="twitter:description" content="Compartilhe áudios autênticos que desaparecem em 24 horas. Conecte-se através da voz e descubra uma nova forma de se expressar." />
    <meta property="twitter:image" content="/lovable-uploads/a384c699-fcd9-4ac6-bcf9-612e01bab15d.png" />
    
    <!-- Additional SEO -->
    <link rel="canonical" href="https://shhhh.me/" />
    <meta name="theme-color" content="#667eea" />
    
    <!-- Cache Control - Expira em 24 horas -->
    <meta http-equiv="Cache-Control" content="public, max-age=86400">
    <meta http-equiv="Expires" content="86400">
    <meta http-equiv="Pragma" content="cache">
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Shhhh",
      "description": "Rede social de áudio temporário onde você compartilha áudios autênticos que desaparecem em 24 horas",
      "url": "https://shhhh.me",
      "applicationCategory": "SocialNetworkingApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "BRL"
      },
      "creator": {
        "@type": "Organization",
        "name": "Shhhh"
      }
    }
    </script>
    
    <!-- Service Worker para controle de cache -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            // Service worker registration failed, but app should still work
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
