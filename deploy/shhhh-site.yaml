version: "3.7"
services:

  site:
    image: nginx:alpine

    volumes:
      - /root/shhhh-site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /root/shhhh-site/public:/usr/share/nginx/html:ro

    networks:
      - Nutef

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.docker.network=Nutef
        - traefik.http.routers.shhhh.rule=Host(`shhhh.me`) || Host(`www.shhhh.me`)
        - traefik.http.routers.shhhh.entrypoints=websecure
        - traefik.http.routers.shhhh.priority=10
        - traefik.http.routers.shhhh.tls=true
        - traefik.http.routers.shhhh.tls.certresolver=letsencryptresolver
        - traefik.http.routers.shhhh.service=shhhh
        - traefik.http.services.shhhh.loadbalancer.server.port=8080
        - traefik.http.services.shhhh.loadbalancer.passHostHeader=true

networks:
  Nutef:
    external: true
    name: Nutef
