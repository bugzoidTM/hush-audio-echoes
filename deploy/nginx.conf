# Público não é a mesma coisa que indexado.
#
# Um Echo aprovado toca para qualquer pessoa com o link — é assim que ele
# circula no WhatsApp e traz gente nova. Mas um desabafo pessoal não pode ficar
# arquivado num buscador por anos, o que contradiz a promessa de conteúdo
# efêmero. O cabeçalho HTTP é o que vale, porque não depende de o rastreador
# executar o JavaScript da SPA.
#
# O `map` é necessário: numa SPA, /e/:id cai em /index.html por try_files, e
# esse redirecionamento interno entra em `location /` — um add_header colocado
# numa location específica de /e/ seria descartado no caminho. Com a variável,
# o cabeçalho é decidido pela URL pedida, não pelo arquivo servido. Valor vazio
# faz o nginx não emitir o cabeçalho.
map $request_uri $shhhh_robots {
    default          "";
    "~^/e/"          "noindex, noarchive, nosnippet";
    # /v/ também no servidor durante o beta. A escolha do dono existe no banco
    # (voices.indexable), mas quem a aplica hoje é a meta tag trocada pelo
    # JavaScript — e nem todo rastreador executa a SPA antes de decidir indexar.
    # Privacidade primeiro: enquanto não houver renderização no servidor para
    # honrar o opt-in por handle, nenhuma Voice é indexada.
    "~^/v/"          "noindex, noarchive";
    "~^/app/"        "noindex, nofollow";
    "~^/admin"       "noindex, nofollow";
    "~^/auth"        "noindex, nofollow";
}

# Rastreadores de link (WhatsApp, Telegram, Twitter/X, Facebook, Discord, Slack,
# LinkedIn) recebem um HTML só com Open Graph do Echo; gente continua recebendo
# a SPA na mesma URL. Sem isto, todo link colado no WhatsApp mostrava o card
# genérico do site em vez da chamada daquele Echo — e o compartilhamento é o
# canal de aquisição do produto.
map $http_user_agent $shhhh_crawler {
    default                          0;
    "~*whatsapp"                     1;
    "~*telegrambot"                  1;
    "~*twitterbot"                   1;
    "~*facebookexternalhit"          1;
    "~*facebookcatalog"              1;
    "~*discordbot"                   1;
    "~*slackbot"                     1;
    "~*linkedinbot"                  1;
    "~*pinterest"                    1;
    "~*redditbot"                    1;
    "~*skypeuripreview"              1;
    "~*embedly"                      1;
    "~*vkshare"                      1;
    "~*w3c_validator"                1;
    "~*bitlybot"                     1;
    "~*applebot"                     1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash no nome podem ser cacheados por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Echo compartilhado. Só o rastreador é desviado para o card; o navegador
    # de uma pessoa cai no try_files como qualquer outra rota da SPA.
    location ~ "^/e/(?<shhhh_echo_id>[0-9a-fA-F-]{36})/?$" {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $shhhh_robots always;

        # DNS interno do Docker. Com variável no proxy_pass o nome é resolvido a
        # cada requisição, e sem resolver o nginx responde 502 antes de tentar.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $shhhh_kong "supabase_kong:8000";

        if ($shhhh_crawler) {
            proxy_pass http://$shhhh_kong/functions/v1/echo-share?id=$shhhh_echo_id;
        }

        # O card é um extra: se o Kong ou a Function estiverem fora, o
        # rastreador recebe o HTML da SPA (card genérico) em vez de um 502.
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;

        try_files $uri /index.html;
    }

    location @spa {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # SPA: qualquer rota (/v/:handle, /app/echoes, /ouvir) cai no index.html.
    # A diretiva de robôs vem do `map` acima, pela URL pedida.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $shhhh_robots always;
        try_files $uri $uri/ /index.html;
    }
}
