project_id = "nutef-self-hosted"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "https://supabase.nutef.com"

[auth]
enabled = true
site_url = "https://supabase.nutef.com"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:5173", "https://supabase.nutef.com"]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = false
# O segredo real fica apenas no .env da stack (variável JWT_SECRET do serviço).
# Nunca versione o valor: com ele é possível forjar um token service_role.
jwt_secret = "env(SUPABASE_AUTH_JWT_SECRET)"